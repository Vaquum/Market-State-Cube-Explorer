name: Check explorer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/build.py --check
      - run: node --check src/explorer.js
      - run: node --check src/state.js
      - run: node --check worker.js
      - run: python3 -m py_compile tools/cube_bridge.py
      - run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/dry-run
