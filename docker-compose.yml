# The explorer on the Origo host, beside the market state cube: host network so the cube
# service is 127.0.0.1:8486; the page is served on 127.0.0.1:8487 only, for a TLS front on
# the host to proxy to. The cube's result volume is mounted read-only at the path the
# service returns. Credentials live in .env.
name: cube-explorer
services:
  explorer:
    build: .
    image: cube-explorer:latest
    network_mode: host
    env_file: .env
    volumes:
      - market-state:/opt/origo/market-state:ro
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8487/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  market-state:
    name: tdw-control-plane_market-state
    external: true
